services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGO_ROOT_USERNAME}", "--password", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    build: ./services/user-service
    environment:
      PORT: 3001
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/userdb?authSource=admin
    ports:
      - "${USER_SERVICE_PORT:-3001}:3001"
    depends_on:
      mongo:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    environment:
      PORT: 3002
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/orderdb?authSource=admin
      USER_SERVICE_URL: http://user-service:3001
      USER_SERVICE_TIMEOUT_MS: ${USER_SERVICE_TIMEOUT_MS:-5000}
    ports:
      - "${ORDER_SERVICE_PORT:-3002}:3002"
    depends_on:
      mongo:
        condition: service_healthy
      user-service:
        condition: service_healthy

  app:
    build: ./app
    environment:
      PORT: 3000
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:3001}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-service:3002}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

volumes:
  mongo-data:
