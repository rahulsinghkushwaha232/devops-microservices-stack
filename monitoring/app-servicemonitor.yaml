apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-app
  namespace: monitoring
  labels:
    app.kubernetes.io/name: devops-app
spec:
  namespaceSelector:
    matchNames:
      - devops-demo
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-app
  jobLabel: app.kubernetes.io/name
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
