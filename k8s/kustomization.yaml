apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops-demo
resources:
  - namespace.yaml
  - configmap.yaml
  - app-deployment.yaml
  - app-service.yaml
  - user-deployment.yaml
  - user-service.yaml
  - order-deployment.yaml
  - order-service.yaml
  - hpa.yaml
  - mongo-pvc.yaml
  - mongo-deployment.yaml
  - mongo-service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# secrets/secrets.example.yaml is documentation-only; local-up creates the real Secret.
images:
  - name: ghcr.io/rahulsinghkushwaha232/devops-app
    newName: ghcr.io/rahulsinghkushwaha232/devops-app
    newTag: latest
  - name: ghcr.io/rahulsinghkushwaha232/devops-user-service
    newName: ghcr.io/rahulsinghkushwaha232/devops-user-service
    newTag: latest
  - name: ghcr.io/rahulsinghkushwaha232/devops-order-service
    newName: ghcr.io/rahulsinghkushwaha232/devops-order-service
    newTag: latest
