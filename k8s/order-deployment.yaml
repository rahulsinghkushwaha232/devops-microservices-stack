apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: devops-demo
  labels:
    app: order-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          image: ghcr.io/rahulsinghkushwaha232/devops-order-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: devops-demo-config
                  key: ORDER_SERVICE_PORT
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: devops-demo-config
                  key: USER_SERVICE_URL
            - name: USER_SERVICE_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: devops-demo-config
                  key: USER_SERVICE_TIMEOUT_MS
            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: devops-demo-config
                  key: ORDER_DATABASE
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_URL
              value: mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@mongo:27017/$(MONGO_DATABASE)?authSource=admin
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
